name: Beebyte scan — trigger on push

# Kicks the beebyte version-check workflow on realm-engine whenever code
# lands on main that touches internal/ or client/plugins/. This triggers
# the existing beebyte-version-check-trigger.yml over there (which SSHes
# to the API server and kicks the systemd unit).
#
# Prerequisites:
#   BEEBYTE_DISPATCH_TOKEN — a PAT (classic or fine-grained) that can
#     trigger workflow_dispatch on Evergreen-Techworks/realm-engine.
#     Fine-grained: scope to realm-engine with Actions read & write.
#     Classic: `repo` scope.

on:
  push:
    branches: [main]
    paths:
      - 'internal/**'
      - 'client/plugins/**'
  workflow_dispatch:
    inputs:
      force:
        description: Force re-bake + scan even if the game build is unchanged.
        type: boolean
        required: false
        default: false

jobs:
  trigger-scan:
    name: Trigger beebyte scan
    runs-on: ubuntu-latest
    concurrency:
      group: beebyte-scan
      cancel-in-progress: false
    steps:
      - name: Dispatch version-check on realm-engine
        env:
          GH_TOKEN: ${{ secrets.BEEBYTE_DISPATCH_TOKEN }}
        run: |
          FORCE="${{ inputs.force || 'false' }}"
          echo "Dispatching beebyte-version-check-trigger.yml (force=${FORCE})"
          gh workflow run beebyte-version-check-trigger.yml \
            -R Evergreen-Techworks/realm-engine \
            -f force="${FORCE}" \
            -f tail_seconds=2400
          echo "Dispatched — check realm-engine Actions for progress."
